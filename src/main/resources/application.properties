spring.application.name=digital-wallet

# Server
server.port=8080

# H2 Database (in-memory)
spring.datasource.url=jdbc:h2:file:./data/walletdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=ChangeThisToAVeryLongSecretKeyAtLeast64CharsForHS512SignatureAlgorithm1234567890
app.jwt.expiration-ms=86400000

# Pagination
app.pagination.default-page-size=10
app.pagination.max-page-size=100
